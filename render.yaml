# Servicio único: React + Express/Socket.IO + SQLite persistente.
# Crear estos recursos en Render es pago; revisar el importe antes de confirmar.
services:
  - type: web
    name: puker
    runtime: node
    plan: starter
    region: virginia
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3001"
      - key: DATABASE_FILE
        value: /var/data/puker.db
      - key: SESSION_SECRET
        generateValue: true
      # Voz: el TURN NO puede vivir acá. Render publica un puerto HTTP y
      # coturn necesita UDP y un rango de puertos para los relays. Va aparte:
      # un servicio de TURN contratado, o un coturn en una máquina chica.
      # Con un servicio contratado se completan estas tres en el panel:
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_PASSWORD
        sync: false
      # Con un coturn propio, en lugar de usuario y clave va el secreto
      # compartido y las credenciales se firman solas:
      - key: TURN_SECRET
        sync: false
    disk:
      name: puker-data
      mountPath: /var/data
      sizeGB: 1
